# Conda environment for the somascan-qc pipeline.
#   conda env create -f environment.yml
#   conda activate somascan-qc
#   pip install --no-deps -e .
name: somascan-qc
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.22
  - pandas>=1.5
  - matplotlib-base>=3.6
  - pyyaml>=6.0
  - pytest>=7
  - pip
